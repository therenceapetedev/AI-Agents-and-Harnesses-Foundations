[project]
name = "ai-agents-and-harnesses-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Therence Apete", email = "apete.therence@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.0",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agents-and-harnesses-foundations = "ai_agents_and_harnesses_foundations:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
